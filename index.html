        ['Comece a revisar TI de forma mais visual hoje.', 'Comece a revisar Mecânica da Transpetro de forma mais visual hoje.'],
        ['Tenha uma biblioteca com +300 Mapas Mentais de Tecnologia da Informação organizada para consultar sempre que precisar.', 'Tenha acesso a uma biblioteca com +300 Mapas Mentais de Manutenção Mecânica, organizada para consultar sempre que precisar.'],

        [' TI em Mapas — Todos os direitos reservados. Material auxiliar de estudo. Não há garantia de aprovação ou resultado em concursos públicos.', ' Transpetro em Mapas — Todos os direitos reservados. Material auxiliar de estudo e revisão. Não há garantia de aprovação ou resultado no processo seletivo da Transpetro.'],

      const painItems = [
        'Conteúdo técnico demais',
        'Conceitos parecidos',
        'PDFs e apostilas enormes',
        'Revisões demoradas',
        'Fórmulas, classificações e detalhes fáceis de confundir',
        'Sensação de esquecer assuntos já estudados'

        'Elementos de Máquinas', 'Mecânica dos Fluidos', 'Lubrificação',

        'Eixos, mancais, polias, engrenagens, correias e correntes',

        'Conhecimentos Básicos + Conhecimentos Específicos organizados',
        'Biblioteca organizada por módulos',
        'Acesso imediato após a confirmação',

      ];
      const special = [
        '+300 Mapas Mentais de Manutenção Mecânica',
        '100 Questões de Mecânica para a Transpetro',
        '100 Pegadinhas de Mecânica para a Transpetro',
        'Guia CESGRANRIO para a Transpetro',
        'Biblioteca Visual Organizada',
        'Atualizações da versão adquirida'
      ];
      const bonus = [
        ['100 Questões de Manutenção Mecânica para a Transpetro', 'Questões organizadas por assuntos da ênfase para você praticar depois da revisão.'],
        ['100 Pegadinhas de Mecânica para a Transpetro', 'Material focado em diferenças, detalhes e pontos que podem confundir na hora da prova.'],
        ['Guia CESGRANRIO para a Transpetro', 'Material complementar para ajudar você a entender melhor o estilo de cobrança da banca.'],
        ['Biblioteca Visual Organizada', 'Mapas organizados por módulos, assuntos e subassuntos para facilitar consulta, estudo e revisão.']
      ];

      function walkAndReplace(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((node) => {
          let value = node.nodeValue;
          replacements.forEach((next, prev) => { value = value.split(prev).join(next); });
          node.nodeValue = value;
        });
      }

      function setListByHeading(headingText, items) {
        const heading = [...document.querySelectorAll('h2')].find((el) => el.textContent.trim() === headingText);
        const section = heading && heading.closest('section');
        const cards = section && [...section.querySelectorAll('.grid > div')];
        if (!cards || !cards.length) return;
        const grid = cards[0].parentElement;
        grid.innerHTML = '';
        items.forEach((text) => {
          const card = cards[0].cloneNode(true);
          const textEl = card.querySelector('p') || card;
          textEl.textContent = text;
          grid.appendChild(card);
        });
      }

      function setPlanList(planName, items) {
        const label = [...document.querySelectorAll('p')].find((el) => el.textContent.trim() === planName);
        const plan = label && label.closest('.rounded-2xl');
        const ul = plan && plan.querySelector('ul');
        if (!ul) return;
        ul.innerHTML = '';
        items.forEach((text) => {
          const li = document.createElement('li');
          li.className = 'flex items-start gap-3';
          li.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-5 w-5 shrink-0 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg><span class="font-medium"></span>';
          li.querySelector('span').textContent = text;
          ul.appendChild(li);
        });
      }

      function updateBonusCards() {
        const cards = [...document.querySelectorAll('h3')].filter((el) => el.closest('section')?.textContent.includes('Transforme revisão visual')).map((el) => el.closest('.flex.flex-col'));
        cards.forEach((card, i) => {
          if (!bonus[i]) return;
          const title = card.querySelector('h3');
          const desc = card.querySelector('p');
          const img = card.querySelector('img');
          title.textContent = bonus[i][0];
          desc.textContent = bonus[i][1];
          if (img) img.alt = bonus[i][0];
        });
      }

      function addFocusSwitch() {
        if (document.querySelector('[data-emphasis-switch]')) return;
        const eyebrow = [...document.querySelectorAll('div')].find((el) => el.textContent.trim() === 'Material auxiliar de estudo e revisão para o Processo Seletivo da Transpetro');
        if (!eyebrow) return;
        const wrap = document.createElement('div');
        wrap.setAttribute('data-emphasis-switch', 'true');
        wrap.className = 'mb-5 inline-flex flex-wrap items-center justify-center gap-2 rounded-full border border-primary/20 bg-card px-2 py-2 text-xs font-semibold shadow-sm sm:text-sm';
        wrap.innerHTML = '<span class="rounded-full bg-primary px-4 py-2 text-primary-foreground">🔧 Mecânica — disponível agora</span><span class="rounded-full px-4 py-2 text-muted-foreground">⚡ Elétrica — em breve</span>';
        eyebrow.parentElement.insertBefore(wrap, eyebrow);
      }

      function updatePage() {
        const root = document.getElementById('root');
        if (!root || !root.textContent.includes('Mapas')) return false;
        walkAndReplace(root);
        addFocusSwitch();
        setListByHeading('Você vai fazer Manutenção Mecânica na Transpetro, mas na hora de revisar parece que o conteúdo não acaba nunca?', painItems);
        setListByHeading('Uma biblioteca visual organizada para revisar os principais assuntos de Mecânica da Transpetro', modules);
        setListByHeading('Com o Transpetro em Mapas — Mecânica, você consegue:', benefits);
        setPlanList('Plano Essencial', essential);
        setPlanList('Plano Completo', special);
        updateBonusCards();
        document.querySelectorAll('a[href="https://pay.wiapy.com/3hQLTwvPTSNP"]').forEach((a) => a.href = 'https://pay.wiapy.com/7JwuqLYYeMYr');
        [...document.querySelectorAll('div')].filter((el) => el.textContent.trim() === 'A biblioteca visual').forEach((el) => { el.childNodes[el.childNodes.length - 1].nodeValue = ' A biblioteca visual para a Transpetro'; });
        [...document.querySelectorAll('p')].filter((el) => el.textContent.trim() === 'Plano Completo').forEach((label) => {
          const plan = label.closest('.rounded-2xl');
          const price = plan && plan.querySelector('.text-4xl');
          if (price) price.textContent = 'R$ 27,90';
          const img = plan && plan.querySelector('img');
          if (img) img.alt = 'Transpetro em Mapas — Mecânica';
        });
        [...document.querySelectorAll('img')].forEach((img) => {
          if (img.alt.includes('TI em Mapas')) img.alt = img.alt.replaceAll('TI em Mapas', 'Transpetro em Mapas — Mecânica');
        });
        const footer = document.querySelector('footer .container, footer div');
        if (footer) footer.textContent = '© 2026 Transpetro em Mapas — Todos os direitos reservados. Material auxiliar de estudo e revisão. Não há garantia de aprovação ou resultado no processo seletivo da Transpetro.';
        return true;
      }

      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        if (updatePage() || tries > 60) clearInterval(timer);
      }, 100);
    })();
  </script>
  <script>
    (function () {
      function applyTranspetroRefinements() {
        const examplesTitle = [...document.querySelectorAll('h2')].find((el) => el.textContent.trim() === 'Veja alguns dos mapas que você vai receber');
        if (examplesTitle && !document.querySelector('[data-map-emphasis-switch]')) {
          const selector = document.createElement('div');
          selector.setAttribute('data-map-emphasis-switch', 'true');
          selector.className = 'mx-auto mt-5 inline-flex flex-wrap items-center justify-center gap-2 rounded-full border border-primary/20 bg-card px-2 py-2 text-xs font-semibold shadow-sm sm:text-sm';
          selector.innerHTML = '<span class="rounded-full bg-primary px-4 py-2 text-primary-foreground">🔧 Mapas de Mecânica — disponíveis agora</span><span class="rounded-full px-4 py-2 text-muted-foreground">⚡ Mapas de Elétrica — em breve</span>';
          examplesTitle.parentElement.appendChild(selector);
        }

        const offer = document.querySelector('#oferta');
        if (offer) {
          const featuredPlan = [...offer.querySelectorAll('.relative.flex.flex-col')].find((el) => el.textContent.includes('Mais escolhido'));
          if (featuredPlan) {
            const planName = featuredPlan.querySelector('p');
            if (planName) planName.textContent = 'Plano Completo';
            const price = featuredPlan.querySelector('.text-4xl');
            if (price) price.textContent = 'R$ 37,90';
            const cta = featuredPlan.querySelector('a, button');
            if (cta) {
              [...cta.childNodes].forEach((node) => {
                if (node.nodeType === Node.TEXT_NODE && node.nodeValue.includes('Quero o Plano Especial')) node.nodeValue = 'Quero o Plano Completo';
              });
              if (cta.tagName === 'A') cta.href = 'https://pay.wiapy.com/3hQLTwvPTSNP';
            }
          }
        }
      }

      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        applyTranspetroRefinements();
        if (document.querySelector('[data-map-emphasis-switch]') || tries > 60) clearInterval(timer);
      }, 100);
    })();
  </script>

  <script>
    (function () {
      function compactEmphasisSelectors() {
        const top = document.querySelector('[data-emphasis-switch]');
        if (top) {
          const spans = top.querySelectorAll('span');
          if (spans[0]) spans[0].textContent = '🔧 Mecânica';
          if (spans[1]) spans[1].textContent = '⚡ Elétrica em breve';
          top.setAttribute('aria-label', 'Ênfase selecionada: Mecânica. Elétrica em breve.');
        }
        const maps = document.querySelector('[data-map-emphasis-switch]');
        if (maps) {
          const spans = maps.querySelectorAll('span');
          if (spans[0]) spans[0].textContent = '🔧 Mecânica';
          if (spans[1]) spans[1].textContent = '⚡ Elétrica em breve';
          maps.setAttribute('aria-label', 'Exemplos atuais: mapas de Mecânica. Mapas de Elétrica em breve.');
        }
      }
      let tries = 0;
      const timer = setInterval(() => {
        tries += 1;
        compactEmphasisSelectors();
        if ((document.querySelector('[data-emphasis-switch]') && document.querySelector('[data-map-emphasis-switch]')) || tries > 60) clearInterval(timer);
      }, 100);
    })();
  </script>

          else mainCta.textContent = 'Quero o Plano Completo por R$ 27,90';
        }

        const secondary = [...dialog.querySelectorAll('a, button')].find((el) => el.textContent.includes('Continuar com o Plano Essencial'));
        if (secondary) secondary.textContent = 'Continuar com o Plano Essencial (R$ 17,90)';
        return true;
      }

      document.addEventListener('click', (event) => {
        const trigger = event.target.closest('button, a');
        if (!trigger || !trigger.textContent.includes('Quero o Plano Essencial')) return;
        let attempts = 0;
        const timer = setInterval(() => {
          attempts += 1;
          if (updateUpgradePopupText() || attempts > 20) clearInterval(timer);
        }, 100);
      });
    })();
  </script>
</body>
